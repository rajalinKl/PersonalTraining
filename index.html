<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrainer Elite - Client Analytics & Logger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased pb-24 selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="bg-[#0f172a]/80 backdrop-blur-md border-b border-slate-800/80 p-4 sticky top-0 z-50 shadow-xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-2.5 h-2.5 bg-emerald-400 rounded-full shadow-[0_0_10px_rgba(52,211,153,0.6)] animate-pulse"></div>
                <h1 class="text-sm font-extrabold tracking-tight text-white uppercase tracking-wider">ProTrainer <span class="text-indigo-400 font-medium">Elite</span></h1>
            </div>
            <button onclick="openAddClientModal()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3.5 py-1.5 rounded-xl font-bold transition shadow-lg shadow-indigo-600/20 active:scale-95">+ Add Client</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Client Selector & Overview Card -->
        <section class="bg-[#111c30] p-4.5 rounded-2xl shadow-xl border border-slate-800/80 space-y-3.5 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/5 rounded-full blur-2xl pointer-events-none"></div>
            <div>
                <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5">Active Client</label>
                <select id="clientSelect" onchange="switchClient()" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-3 text-sm font-bold text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition shadow-inner">
                    <!-- Populated by JS -->
                </select>
            </div>
            <div id="clientSummaryStats" class="grid grid-cols-3 gap-2.5 pt-1 text-center">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Navigation Tab Menu -->
        <div class="flex bg-[#111c30] p-1.5 rounded-2xl border border-slate-800/80 shadow-lg">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition-all">Sessions</button>
            <button onclick="switchTab('exercises')" id="tab-exercises" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">Exercises</button>
            <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">Progress</button>
            <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">+ Log</button>
        </div>

        <!-- TAB 1: ALL SESSIONS HISTORY -->
        <div id="content-dashboard" class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Complete Session Logs</h2>
            </div>
            <div id="allSessionsContainer" class="space-y-3">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- TAB 2: EXERCISE DIRECTORY & MUSCLE GROUPS -->
        <div id="content-exercises" class="space-y-3 hidden">
            <div class="bg-[#111c30] p-3 rounded-2xl border border-slate-800/80 shadow-lg">
                <input type="text" id="exerciseSearch" placeholder="Search exercises (e.g. Squats, Bench)..." oninput="filterExercises()" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-3 text-xs text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div id="exerciseDirectoryContainer" class="space-y-2.5">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- TAB 3: ADVANCED ANALYTICS & PROGRESS -->
        <div id="content-analytics" class="space-y-4 hidden">
            <!-- Body Metrics Tracking Card -->
            <div class="bg-[#111c30] p-4.5 rounded-2xl shadow-xl border border-slate-800/80 space-y-3.5">
                <div class="flex justify-between items-center">
                    <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">InBody Scan & Composition</h2>
                    <button onclick="openBodyMetricModal()" class="text-[10px] bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-xl font-bold text-white transition shadow-md shadow-indigo-600/20">+ Log Scan</button>
                </div>
                <div class="relative h-52 bg-[#0b1322] p-3 rounded-xl border border-slate-800 shadow-inner">
                    <canvas id="bodyStatsChart"></canvas>
                </div>
            </div>

            <!-- Muscle Group Progression Overview -->
            <div class="bg-[#111c30] p-4.5 rounded-2xl shadow-xl border border-slate-800/80 space-y-3">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Muscle Group Volume Distribution</h2>
                <div id="muscleGroupStatsContainer" class="space-y-2.5">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- TAB 4: LOG MULTI-EXERCISE SESSION -->
        <div id="content-log" class="space-y-4 hidden">
            <div class="bg-[#111c30] p-5 rounded-2xl shadow-xl border border-slate-800/80 space-y-4">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Record Full Workout Session</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-300 mb-1">Session Date</label>
                        <input type="date" id="logDate" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-3 text-xs font-semibold text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-300 mb-1">Phase / Tag</label>
                        <input type="text" id="logPhase" placeholder="e.g. P2, W1D1" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-3 text-xs font-semibold text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="space-y-2.5 pt-1">
                    <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Exercises Performed</label>
                    <div id="logExerciseRowsContainer" class="space-y-2.5">
                        <!-- Dynamic rows injected here -->
                    </div>
                    <button type="button" onclick="addExerciseRow()" class="w-full bg-[#1b273d] hover:bg-[#23334f] text-slate-200 py-3 rounded-xl text-xs font-bold transition border border-slate-700/80 shadow-sm">+ Add Another Exercise</button>
                </div>

                <button onclick="saveMultiExerciseSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition-all mt-2 active:scale-98">Save Complete Session</button>
            </div>
        </div>

    </main>

    <!-- EXERCISE DETAIL & PROGRESS CHART MODAL -->
    <div id="exerciseModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#111c30] w-full max-w-lg p-5.5 rounded-3xl border border-slate-700/80 shadow-2xl space-y-4.5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3.5">
                <div>
                    <h3 id="modalExerciseTitle" class="font-extrabold text-base text-white">Exercise Name</h3>
                    <span id="modalMuscleTag" class="text-[10px] uppercase font-extrabold tracking-wider px-2.5 py-1 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mt-1.5 inline-block">Muscle Group</span>
                </div>
                <button onclick="closeExerciseModal()" class="text-slate-400 hover:text-white bg-slate-800/80 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition">✕</button>
            </div>
            <div class="space-y-2">
                <h4 class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Weight Progression Chart</h4>
                <div class="relative h-56 bg-[#0b1322] p-3 rounded-2xl border border-slate-800 shadow-inner">
                    <canvas id="exerciseModalChart"></canvas>
                </div>
            </div>
            <div class="space-y-2">
                <h4 class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Historical Performance Logs</h4>
                <div id="modalHistoryList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <!-- UPDATE INBODY METRICS MODAL -->
    <div id="bodyMetricModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#111c30] w-full max-w-md p-6 rounded-3xl border border-slate-700/80 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="font-extrabold text-base text-white">Log InBody Scan Metrics</h3>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 mb-1">Scan Date</label>
                <input type="date" id="metricDate" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-3 text-xs font-semibold text-white outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">Weight (kg)</label>
                    <input type="number" step="0.1" id="metricWeight" placeholder="e.g. 99.0" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">Skeletal Muscle (kg)</label>
                    <input type="number" step="0.1" id="metricMuscle" placeholder="e.g. 46.9" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white outline-none">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">Body Fat Mass (kg)</label>
                    <input type="number" step="0.1" id="metricFatMass" placeholder="e.g. 17.5" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">BMI (kg/m²)</label>
                    <input type="number" step="0.1" id="metricBmi" placeholder="e.g. 26.0" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white outline-none">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 mb-1">Percent Body Fat (%)</label>
                <input type="number" step="0.1" id="metricBodyFatPct" placeholder="e.g. 17.6" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white outline-none">
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeBodyMetricModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-xs font-bold text-slate-300 transition">Cancel</button>
                <button onclick="saveBodyMetric()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition">Save InBody Scan</button>
            </div>
        </div>
    </div>

    <!-- Add Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#111c30] w-full max-w-sm p-6 rounded-3xl border border-slate-700/80 shadow-2xl space-y-4">
            <h3 class="font-extrabold text-base text-white">Add New Client</h3>
            <input type="text" id="newClientName" placeholder="Client Full Name" class="w-full bg-[#0b1322] border border-slate-700/80 rounded-xl p-3.5 text-xs font-semibold text-white placeholder-slate-600 outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex space-x-3 pt-2">
                <button onclick="closeAddClientModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-xs font-bold text-slate-300 transition">Cancel</button>
                <button onclick="addNewClient()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition">Save Client</button>
            </div>
        </div>
    </div>

        function getMuscleGroup(exerciseName) {
            const name = exerciseName.toLowerCase();
            if (name.includes('squat') || name.includes('lunge') || name.includes('leg press') || name.includes('step') || name.includes('jump') || name.includes('extension')) return 'Quads & Glutes';
            if (name.includes('rdl') || name.includes('romanian') || name.includes('deadlift') || name.includes('curl') && name.includes('leg')) return 'Hamstrings & Posterior';
            if (name.includes('bench') || name.includes('press') && (name.includes('incline') || name.includes('chest')) || name.includes('push up') || name.includes('fly') || name.includes('dips')) return 'Chest & Push';
            if (name.includes('pull') || name.includes('row') || name.includes('lat') || name.includes('chin')) return 'Back & Pull';
            if (name.includes('shoulder') || name.includes('press') || name.includes('raise') || name.includes('facepull')) return 'Shoulders';
            if (name.includes('curl') || name.includes('tricep') || name.includes('skull')) return 'Arms (Biceps/Triceps)';
            return 'Core & Full Body';
        }

        function initApp() {
            updateClientDropdown();
            renderDashboard();
            renderExerciseDirectory();
            renderAnalytics();
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('metricDate').value = new Date().toISOString().split('T')[0];
            addExerciseRow();
        }

        function updateClientDropdown() {
            const select = document.getElementById('clientSelect');
            select.innerHTML = '';
            Object.keys(db).forEach(client => {
                let opt = document.createElement('option');
                opt.value = client;
                opt.textContent = client;
                if(client === currentClient) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchClient() {
            currentClient = document.getElementById('clientSelect').value;
            renderDashboard();
            renderExerciseDirectory();
            renderAnalytics();
        }

        function switchTab(tab) {
            ['dashboard', 'exercises', 'analytics', 'log'].forEach(t => {
                document.getElementById('content-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
                document.getElementById('tab-' + t).classList.add('text-slate-400');
            });
            document.getElementById('content-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
            document.getElementById('tab-' + tab).classList.remove('text-slate-400');
            if(tab === 'analytics') renderAnalytics();
        }

        function renderDashboard() {
            const clientData = db[currentClient];
            const totalSessions = clientData.sessions.length;
            let uniqueExercises = new Set();
            clientData.sessions.forEach(s => s.exercises.forEach(e => uniqueExercises.add(e.name)));

            document.getElementById('clientSummaryStats').innerHTML = `
                <div class="bg-[#0b1322] p-2.5 rounded-xl border border-slate-800 shadow-inner">
                    <span class="block text-[9px] text-slate-400 uppercase font-extrabold tracking-widest">Total Sessions</span>

                    <span class="block text-[9px] text-slate-400 uppercase font-extrabold tracking-widest">Exercises</span>
                    <span class="text-sm font-extrabold text-emerald-400 mt-0.5 block">${uniqueExercises.size}</span>
                </div>
                <div class="bg-[#0b1322] p-2.5 rounded-xl border border-slate-800 shadow-inner">

            let html = '';
            sortedSessions.forEach(session => {
                html += `
                    <div class="bg-[#111c30] p-4 rounded-2xl shadow-lg border border-slate-800/80 space-y-2.5">

                `;
                session.exercises.forEach(ex => {
                    let muscle = getMuscleGroup(ex.name);
                    html += `

        function renderExerciseDirectory(filter = '') {
            const clientData = db[currentClient];
            const container = document.getElementById('exerciseDirectoryContainer');

            let exerciseMap = {};
            clientData.sessions.forEach(session => {
                session.exercises.forEach(ex => {
                    let cleanName = ex.name.trim();
                    if (!exerciseMap[cleanName]) {
                        exerciseMap[cleanName] = { name: cleanName, muscle: getMuscleGroup(cleanName), count: 0, lastSets: '' };
                    }
                    exerciseMap[cleanName].count++;
                    exerciseMap[cleanName].lastSets = ex.sets;
                });
            });

            let exercises = Object.values(exerciseMap).sort((a,b) => b.count - a.count);
            if (filter) {
                exercises = exercises.filter(e => e.name.toLowerCase().includes(filter.toLowerCase()));
            }

            let html = '';
            exercises.forEach(ex => {
                html += `
                    <div onclick="openExerciseModal('${ex.name.replace(/'/g, "\\'")}')" class="bg-[#111c30] p-4 rounded-2xl shadow-lg border border-slate-800/80 flex justify-between items-center cursor-pointer hover:bg-[#16233b] transition-all group">
                        <div>
                            <div class="text-xs font-bold text-white group-hover:text-indigo-300 transition">${ex.name}</div>
                            <div class="text-[10px] text-slate-400 font-semibold mt-0.5">${ex.muscle} • <span class="text-slate-500">${ex.count} sessions</span></div>
                        </div>
                        <div class="text-right">
                            <span class="text-[11px] font-mono font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-xl">${ex.lastSets}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || '<p class="text-xs text-slate-500 text-center py-6">No exercises found.</p>';
        }

        function filterExercises() {
            let query = document.getElementById('exerciseSearch').value;
            renderExerciseDirectory(query);
        }

        function renderAnalytics() {
            const clientData = db[currentClient];
            
            let muscleCounts = {};
            clientData.sessions.forEach(s => {
                s.exercises.forEach(e => {
                    let m = getMuscleGroup(e.name);
                    muscleCounts[m] = (muscleCounts[m] || 0) + 1;
                });
            });

            let muscleContainer = document.getElementById('muscleGroupStatsContainer');
            let muscleHtml = '';
            let totalExCount = Object.values(muscleCounts).reduce((a,b) => a+b, 0) || 1;

            Object.keys(muscleCounts).forEach(muscle => {
                let count = muscleCounts[muscle];
                let percent = Math.round((count / totalExCount) * 100);
                muscleHtml += `
                    <div class="bg-[#0b1322] p-3 rounded-xl border border-slate-800 shadow-inner space-y-1.5">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-slate-200">${muscle}</span>
                            <span class="font-mono text-indigo-400 font-bold">${count} entries (${percent}%)</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                            <div class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
            muscleContainer.innerHTML = muscleHtml || '<p class="text-xs text-slate-500">No workout data available.</p>';

            let metrics = clientData.bodyMetrics || [];
            metrics.sort((a,b) => new Date(a.date) - new Date(b.date));

            let mDates = metrics.map(m => m.date);
            let mWeights = metrics.map(m => m.weight);
            let mMuscles = metrics.map(m => m.muscle || null);
            let mFat = metrics.map(m => m.fatMass || null);

            const ctx = document.getElementById('bodyStatsChart').getContext('2d');
            if (bodyStatsChartInstance) bodyStatsChartInstance.destroy();
            bodyStatsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: mDates.length ? mDates : ['No Data'],
                    datasets: [
                        {
                            label: 'Weight (kg)',
                            data: mWeights.length ? mWeights : [0],
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.05)',
                            borderWidth: 2.5,
                            tension: 0.25
                        },
                        {
                            label: 'Muscle Mass (kg)',
                            data: mMuscles.length ? mMuscles : [0],
                            borderColor: '#34d399',
                            backgroundColor: 'rgba(52, 211, 153, 0.05)',
                            borderWidth: 2.5,
                            tension: 0.25
                        },
                        {
                            label: 'Body Fat (kg)',
                            data: mFat.length ? mFat : [0],
                            borderColor: '#f43f5e',
                            backgroundColor: 'rgba(244, 63, 94, 0.05)',
                            borderWidth: 2.5,
                            tension: 0.25
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 9, family: 'Plus Jakarta Sans', weight: '600' } } } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#1e293b' } },
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }

        function addExerciseRow() {
            const container = document.getElementById('logExerciseRowsContainer');
            const rowId = 'ex-row-' + Date.now() + Math.random();
            const rowDiv = document.createElement('div');
            rowDiv.id = rowId;
            rowDiv.className = "flex gap-2 items-center bg-[#0b1322] p-3 rounded-2xl border border-slate-800 shadow-sm";
            rowDiv.innerHTML = `
                <div class="flex-1 space-y-2">
                    <input type="text" placeholder="Exercise Name (e.g. Bench press)" class="log-ex-name w-full bg-[#111c30] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white placeholder-slate-600 outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" placeholder="Sets/Weights (e.g. 40kgx10 45kgx8)" class="log-ex-sets w-full bg-[#111c30] border border-slate-700/80 rounded-xl p-2.5 text-xs font-semibold text-white placeholder-slate-600 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="button" onclick="document.getElementById('${rowId}').remove()" class="text-rose-400 hover:text-rose-300 bg-rose-500/10 border border-rose-500/20 w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs transition">✕</button>
            `;
            container.appendChild(rowDiv);
        }

        function saveMultiExerciseSession() {
            const date = document.getElementById('logDate').value || new Date().toISOString().split('T')[0];
            const phase = document.getElementById('logPhase').value.trim();
            
            const nameInputs = document.querySelectorAll('.log-ex-name');
            const setInputs = document.querySelectorAll('.log-ex-sets');
            
            let newExercises = [];
            for(let i=0; i<nameInputs.length; i++) {
                let name = nameInputs[i].value.trim();
                let sets = setInputs[i].value.trim();
                if(name && sets) {
                    newExercises.push({ name, sets });
                }
            }

            if(newExercises.length === 0) {
                alert("Please fill out at least one complete exercise with name and sets.");
                return;
            }

            let clientData = db[currentClient];
            let session = clientData.sessions.find(s => s.date === date);
            if (!session) {
                session = { date, phase, exercises: [] };
                clientData.sessions.push(session);
            }

            session.exercises.push(...newExercises);
            if(phase) session.phase = phase;

            alert("Workout session logged successfully!");
            
            document.getElementById('logPhase').value = '';
            document.getElementById('logExerciseRowsContainer').innerHTML = '';
            addExerciseRow();
            
            renderDashboard();
            renderExerciseDirectory();
            renderAnalytics();
            switchTab('dashboard');
        }

        function openExerciseModal(exerciseName) {
            const clientData = db[currentClient];
            document.getElementById('modalExerciseTitle').textContent = exerciseName;
            document.getElementById('modalMuscleTag').textContent = getMuscleGroup(exerciseName);
            document.getElementById('exerciseModal').classList.remove('hidden');

            let dates = [];
            let maxWeights = [];
            let historyHtml = '';

            let sortedSessions = [...clientData.sessions].sort((a,b) => new Date(a.date) - new Date(b.date));

            sortedSessions.forEach(session => {
                session.exercises.forEach(ex => {
                    if (ex.name.toLowerCase() === exerciseName.toLowerCase()) {
                        historyHtml = `
                            <div class="flex justify-between items-center bg-[#0b1322] p-3 rounded-xl text-xs border border-slate-800">
                                <span class="text-indigo-300 font-bold">${session.date}</span>
                                <span class="font-mono text-emerald-400 font-bold">${ex.sets}</span>
                            </div>
                        ` + historyHtml;

                        let match = ex.sets.match(/(\d+(\.\d+)?)\s*(kg|lbs)/i);
                        if (match) {
                            dates.push(session.date);
                            maxWeights.push(parseFloat(match[1]));
                        }
                    }
                });
            });

            document.getElementById('modalHistoryList').innerHTML = historyHtml || '<p class="text-xs text-slate-500">No logs for this exercise.</p>';

            const ctx = document.getElementById('exerciseModalChart').getContext('2d');
            if (modalChartInstance) modalChartInstance.destroy();
            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates.length ? dates : ['No Weight Data'],
                    datasets: [{
                        label: 'Weight Lifted',
                        data: maxWeights.length ? maxWeights : [0],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.25
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#1e293b' } },
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }

        function closeExerciseModal() { document.getElementById('exerciseModal').classList.add('hidden'); }
        
        function openBodyMetricModal() { document.getElementById('bodyMetricModal').classList.remove('hidden'); }
        function closeBodyMetricModal() { document.getElementById('bodyMetricModal').classList.add('hidden'); }
        
        function saveBodyMetric() {
            const date = document.getElementById('metricDate').value;
            const weight = parseFloat(document.getElementById('metricWeight').value);
            const muscle = parseFloat(document.getElementById('metricMuscle').value);
            const fatMass = parseFloat(document.getElementById('metricFatMass').value);
            const bmi = parseFloat(document.getElementById('metricBmi').value);
            const bodyFatPct = parseFloat(document.getElementById('metricBodyFatPct').value);

            if(!date || isNaN(weight)) {
                alert("Please provide at least a valid date and body weight.");
                return;
            }

            let clientData = db[currentClient];
            if(!clientData.bodyMetrics) clientData.bodyMetrics = [];

            clientData.bodyMetrics = clientData.bodyMetrics.filter(m => m.date !== date);
            clientData.bodyMetrics.push({ 
                date, 
                weight, 
                muscle: isNaN(muscle) ? null : muscle, 
                fatMass: isNaN(fatMass) ? null : fatMass, 
                bmi: isNaN(bmi) ? null : bmi, 
                bodyFatPct: isNaN(bodyFatPct) ? null : bodyFatPct 
            });

            alert("InBody scan metrics saved successfully!");
            closeBodyMetricModal();
            renderAnalytics();
        }

        function openAddClientModal() { document.getElementById('clientModal').classList.remove('hidden'); }
        function closeAddClientModal() { document.getElementById('clientModal').classList.add('hidden'); }
        
        function addNewClient() {
            const name = document.getElementById('newClientName').value.trim();
            if(name && !db[name]) {
                db[name] = { bodyMetrics: [], sessions: [] };
                currentClient = name;
                updateClientDropdown();
                renderDashboard();
                renderExerciseDirectory();
                renderAnalytics();
                closeAddClientModal();
                document.getElementById('newClientName').value = '';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
