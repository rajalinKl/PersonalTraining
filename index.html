<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrainer - Advanced Client Progress Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased pb-20">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <h1 class="text-base font-bold tracking-tight text-white">ProTrainer Analytics</h1>
            </div>
            <button onclick="openAddClientModal()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg font-semibold transition shadow-sm">+ Client</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Client Selector & Overview Quick Card -->
        <section class="bg-slate-800 p-4 rounded-2xl shadow-md border border-slate-700/60 space-y-3">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Active Client</label>
                <select id="clientSelect" onchange="switchClient()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm font-semibold text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    <!-- Populated by JS -->
                </select>
            </div>
            <div id="clientSummaryStats" class="grid grid-cols-3 gap-2 pt-1 text-center">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700/60 shadow-inner">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow transition">Sessions</button>
            <button onclick="switchTab('exercises')" id="tab-exercises" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Exercises</button>
            <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">+ Log</button>
        </div>

        <!-- TAB 1: ALL SESSIONS HISTORY -->
        <div id="content-dashboard" class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Complete Session Logs (30+ Recorded)</h2>
            </div>
            <div id="allSessionsContainer" class="space-y-3">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- TAB 2: EXERCISE DIRECTORY & MUSCLE GROUPS -->
        <div id="content-exercises" class="space-y-3 hidden">
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700/60">
                <input type="text" id="exerciseSearch" placeholder="Search exercises (e.g. Squats, Pull ups)..." oninput="filterExercises()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div id="exerciseDirectoryContainer" class="space-y-2">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- TAB 3: LOG NEW SESSION -->
        <div id="content-log" class="space-y-4 hidden">
            <div class="bg-slate-800 p-4 rounded-2xl shadow-md border border-slate-700/60 space-y-3.5">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Add New Workout Session</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Session Date</label>
                    <input type="date" id="logDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Phase / Tag (Optional)</label>
                    <input type="text" id="logPhase" placeholder="e.g. P2, W1D1" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Exercise Name</label>
                        <input type="text" id="logExerciseName" placeholder="e.g. Bench press" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Sets & Weights</label>
                        <input type="text" id="logSetsDetail" placeholder="e.g. 40kgx10 45kgx8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <button onclick="saveNewSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl text-sm font-semibold shadow-lg transition mt-2">Save Session Entry</button>
            </div>
        </div>

    </main>

    <!-- EXERCISE DETAIL & PROGRESS CHART MODAL -->
    <div id="exerciseModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 w-full max-w-lg p-5 rounded-2xl border border-slate-700 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <div>
                    <h3 id="modalExerciseTitle" class="font-bold text-base text-white">Exercise Name</h3>
                    <span id="modalMuscleTag" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 mt-1 inline-block">Muscle Group</span>
                </div>
                <button onclick="closeExerciseModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Weight Progression Chart</h4>
                <div class="relative h-56 bg-slate-900/50 p-2 rounded-xl border border-slate-700/50">
                    <canvas id="exerciseModalChart"></canvas>
                </div>
            </div>
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Historical Performance Logs</h4>
                <div id="modalHistoryList" class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 w-full max-w-sm p-6 rounded-2xl border border-slate-700 shadow-2xl space-y-4">
            <h3 class="font-bold text-base text-white">Add New Client</h3>
            <input type="text" id="newClientName" placeholder="Client Full Name" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex space-x-3 pt-2">
                <button onclick="closeAddClientModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl text-xs font-semibold text-slate-300 transition">Cancel</button>
                <button onclick="addNewClient()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold transition shadow">Save Client</button>
            </div>
        </div>
    </div>

                    { "date": "2026-07-31", "phase": "P3", "exercises": [ { "name": "Reverse lunges", "sets": "DB30lbsx10 a side" }, { "name": "Box jumps", "sets": "BWx10" }, { "name": "Pull ups", "sets": "x5" }, { "name": "Push ups", "sets": "x10" }, { "name": "Seated curls", "sets": "DB20lbsx15" }, { "name": "Tricep extensions", "sets": "CBL8x15" } ] },
                    { "date": "2026-08-10", "phase": "P1", "exercises": [ { "name": "Hack squats", "sets": "MC27kgx12/12/12" }, { "name": "Romanian deadlifts", "sets": "SB30kgx12/12 35kgx12" }, { "name": "Lat pulldowns", "sets": "CBL10x15 no11x12 no12x12" }, { "name": "Bench press", "sets": "BB20kgx15 25kgx12/15" }, { "name": "Seated shoulder press", "sets": "DB20lbsx15/15/15" }, { "name": "Incline curls", "sets": "DB15lbsx15/15/15" }, { "name": "Skull crushers", "sets": "MGB5kgx15/15/15" } ] },
                    { "date": "2026-08-17", "phase": "P1", "exercises": [ { "name": "Squats", "sets": "SM20kgx15 30kgx12 40kgx12" }, { "name": "Lat pulldowns", "sets": "CBL11x15 no12x13/12" }, { "name": "Incline press", "sets": "DB20kgx15/15 22.5kgx12" }, { "name": "Rear delt fly", "sets": "DB15lbsx15/15/15" } ] },
                    { "date": "2026-08-24", "phase": "P2", "exercises": [ { "name": "Reverse lunges", "sets": "DB30lbsx12/12 17.5kgx8/8 a side" }, { "name": "Pull ups", "sets": "BWx8/6/5" }, { "name": "Lat pulldowns narrow", "sets": "CBL13x10/10" }, { "name": "Bench press", "sets": "BB30kgx12 35kgx10/10" }, { "name": "Seated shoulder press", "sets": "DB20kgx10/10/8" } ] },
                    { "date": "2026-08-28", "phase": "P2", "exercises": [ { "name": "Squats", "sets": "SM20kgx10 30kgx10 40kgx10 45kgx10 50kgx10" }, { "name": "Pull ups", "sets": "BWx9.5/7.5/6" }, { "name": "Bench press", "sets": "BB40kgx10 45kgx10/8" }, { "name": "Skullcrushers", "sets": "SB25kgx10/10/10" }, { "name": "Seated curls", "sets": "DB25lbsx10/10/10" } ] },
                    { "date": "2026-08-31", "phase": "P2", "exercises": [ { "name": "Bulgarian split squats", "sets": "DB15lbsx12 20lbsx12 25lbsx10" }, { "name": "Aus pull ups", "sets": "BWx15/15" }, { "name": "Pull ups", "sets": "BWx6/5/5" }, { "name": "Incline press", "sets": "SM40kgx12 50kgx10 55kgx10" }, { "name": "Narrow push ups", "sets": "BWx12/12/10" } ] }
                ]
            }
        };

        let currentClient = "Ramneek";
        let modalChartInstance = null;

        // Muscle Group Mapping Helper
        function getMuscleGroup(exerciseName) {
            const name = exerciseName.toLowerCase();
            if (name.includes('squat') || name.includes('lunge') || name.includes('leg press') || name.includes('step') || name.includes('jump') || name.includes('extension')) return 'Quads & Glutes';
            if (name.includes('rdl') || name.includes('romanian') || name.includes('deadlift') || name.includes('curl') && name.includes('leg')) return 'Hamstrings & Posterior';
            if (name.includes('bench') || name.includes('press') && (name.includes('incline') || name.includes('chest')) || name.includes('push up') || name.includes('fly') || name.includes('dips')) return 'Chest & Push';
            if (name.includes('pull') || name.includes('row') || name.includes('lat') || name.includes('chin')) return 'Back & Pull';
            if (name.includes('shoulder') || name.includes('press') || name.includes('raise') || name.includes('facepull')) return 'Shoulders';
            if (name.includes('curl') || name.includes('tricep') || name.includes('skull')) return 'Arms (Biceps/Triceps)';
            return 'Core & Full Body';
        }

        function initApp() {
            updateClientDropdown();
            renderDashboard();
            renderExerciseDirectory();
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
        }

        function updateClientDropdown() {
            const select = document.getElementById('clientSelect');
            select.innerHTML = '';
            Object.keys(db).forEach(client => {
                let opt = document.createElement('option');
                opt.value = client;
                opt.textContent = client;
                if(client === currentClient) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchClient() {
            currentClient = document.getElementById('clientSelect').value;
            renderDashboard();
            renderExerciseDirectory();
        }

        function switchTab(tab) {
            ['dashboard', 'exercises', 'log'].forEach(t => {
                document.getElementById('content-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('bg-indigo-600', 'text-white', 'shadow');
                document.getElementById('tab-' + t).classList.add('text-slate-400');
            });
            document.getElementById('content-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('bg-indigo-600', 'text-white', 'shadow');
            document.getElementById('tab-' + tab).classList.remove('text-slate-400');
        }

        function renderDashboard() {
            const clientData = db[currentClient];
            
            // Stats Header
            const totalSessions = clientData.sessions.length;
            let uniqueExercises = new Set();
            clientData.sessions.forEach(s => s.exercises.forEach(e => uniqueExercises.add(e.name)));

            document.getElementById('clientSummaryStats').innerHTML = `
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/40">
                    <span class="block text-[9px] text-slate-400 uppercase font-bold tracking-wider">Total Sessions</span>
                    <span class="text-sm font-extrabold text-indigo-400 mt-0.5 block">${totalSessions}</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/40">
                    <span class="block text-[9px] text-slate-400 uppercase font-bold tracking-wider">Exercises</span>
                    <span class="text-sm font-extrabold text-emerald-400 mt-0.5 block">${uniqueExercises.size}</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/40">
                    <span class="block text-[9px] text-slate-400 uppercase font-bold tracking-wider">Status</span>
                    <span class="text-xs font-bold text-sky-400 mt-1 block">Active</span>
                </div>
            `;

            // Sessions List (Sorted newest first)
            const container = document.getElementById('allSessionsContainer');
            let sortedSessions = [...clientData.sessions].sort((a,b) => new Date(b.date) - new Date(a.date));
            
            let html = '';
            sortedSessions.forEach(session => {
                html += `
                    <div class="bg-slate-800 p-3.5 rounded-2xl shadow-md border border-slate-700/60 space-y-2">
                        <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
                            <span class="text-xs font-bold text-indigo-400">${session.date}</span>
                            ${session.phase ? `<span class="text-[10px] font-mono bg-indigo-500/10 text-indigo-300 px-2 py-0.5 rounded">${session.phase}</span>` : ''}
                        </div>
                        <div class="space-y-1.5">
                `;
                session.exercises.forEach(ex => {
                    let muscle = getMuscleGroup(ex.name);
                    html += `
                        <div class="flex justify-between items-center bg-slate-900/40 p-2 rounded-xl text-xs border border-slate-700/40">
                            <div>
                                <span class="font-medium text-slate-200 block">${ex.name}</span>
                                <span class="text-[10px] text-slate-400">${muscle}</span>
                            </div>
                            <span class="font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded text-right">${ex.sets}</span>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function renderExerciseDirectory(filter = '') {
            const clientData = db[currentClient];
            const container = document.getElementById('exerciseDirectoryContainer');

            // Aggregate all unique exercises across all sessions
            let exerciseMap = {};
            clientData.sessions.forEach(session => {
                session.exercises.forEach(ex => {
                    let cleanName = ex.name.trim();
                    if (!exerciseMap[cleanName]) {
                        exerciseMap[cleanName] = { name: cleanName, muscle: getMuscleGroup(cleanName), count: 0, lastSets: '' };
                    }
                    exerciseMap[cleanName].count++;
                    exerciseMap[cleanName].lastSets = ex.sets;
                });
            });

            let exercises = Object.values(exerciseMap).sort((a,b) => b.count - a.count);
            if (filter) {
                exercises = exercises.filter(e => e.name.toLowerCase().includes(filter.toLowerCase()));
            }

            let html = '';
            exercises.forEach(ex => {
                html += `
                    <div onclick="openExerciseModal('${ex.name.replace(/'/g, "\\'")}')" class="bg-slate-800 p-3.5 rounded-xl shadow border border-slate-700/60 flex justify-between items-center cursor-pointer hover:bg-slate-750 transition">
                        <div>
                            <div class="text-xs font-bold text-white">${ex.name}</div>
                            <div class="text-[10px] text-indigo-400 font-medium mt-0.5">${ex.muscle} • <span class="text-slate-400">${ex.count} sessions logged</span></div>
                        </div>
                        <div class="text-right">
                            <span class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded">${ex.lastSets}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || '<p class="text-xs text-slate-500 text-center py-4">No exercises found.</p>';
        }

        function filterExercises() {
            let query = document.getElementById('exerciseSearch').value;
            renderExerciseDirectory(query);
        }

        function openExerciseModal(exerciseName) {
            const clientData = db[currentClient];
            document.getElementById('modalExerciseTitle').textContent = exerciseName;
            document.getElementById('modalMuscleTag').textContent = getMuscleGroup(exerciseName);
            document.getElementById('exerciseModal').classList.remove('hidden');

            let dates = [];
            let maxWeights = [];
            let historyHtml = '';

            // Sort chronological for charting
            let sortedSessions = [...clientData.sessions].sort((a,b) => new Date(a.date) - new Date(b.date));

            sortedSessions.forEach(session => {
                session.exercises.forEach(ex => {
                    if (ex.name.toLowerCase() === exerciseName.toLowerCase()) {
                        historyHtml = `
                            <div class="flex justify-between items-center bg-slate-900/60 p-2.5 rounded-xl text-xs border border-slate-700/40">
                                <span class="text-indigo-300 font-semibold">${session.date}</span>
                                <span class="font-mono text-emerald-400 font-bold">${ex.sets}</span>
                            </div>
                        ` + historyHtml;

                        // extract first numeric weight found for chart
                        let match = ex.sets.match(/(\d+(\.\d+)?)\s*(kg|lbs)/i);
                        if (match) {
                            dates.push(session.date);
                            maxWeights.push(parseFloat(match[1]));
                        }
                    }
                });
            });

            document.getElementById('modalHistoryList').innerHTML = historyHtml || '<p class="text-xs text-slate-500">No logs for this exercise.</p>';

            // Render Chart
            const ctx = document.getElementById('exerciseModalChart').getContext('2d');
            if (modalChartInstance) modalChartInstance.destroy();
            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates.length ? dates : ['No Weight Data'],
                    datasets: [{
                        label: 'Weight Lifted',
                        data: maxWeights.length ? maxWeights : [0],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.25
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function closeExerciseModal() {
            document.getElementById('exerciseModal').classList.add('hidden');
        }

        function saveNewSession() {
            const date = document.getElementById('logDate').value || new Date().toISOString().split('T')[0];
            const phase = document.getElementById('logPhase').value.trim();
            const exName = document.getElementById('logExerciseName').value.trim();
            const setsDetail = document.getElementById('logSetsDetail').value.trim();

            if(!exName || !setsDetail) {
                alert("Please fill out exercise name and sets/weight details.");
                return;
            }

            let clientData = db[currentClient];
            let session = clientData.sessions.find(s => s.date === date);
            if (!session) {
                session = { date, phase, exercises: [] };
                clientData.sessions.push(session);
            }

            session.exercises.push({ name: exName, sets: setsDetail });

            alert("Session logged successfully!");
            document.getElementById('logExerciseName').value = '';
            document.getElementById('logSetsDetail').value = '';
            document.getElementById('logPhase').value = '';
            renderDashboard();
            renderExerciseDirectory();
            switchTab('dashboard');
        }

        function openAddClientModal() { document.getElementById('clientModal').classList.remove('hidden'); }
        function closeAddClientModal() { document.getElementById('clientModal').classList.add('hidden'); }
        function addNewClient() {
            const name = document.getElementById('newClientName').value.trim();
            if(name && !db[name]) {
                db[name] = { sessions: [] };
                currentClient = name;
                updateClientDropdown();
                renderDashboard();
                renderExerciseDirectory();
                closeAddClientModal();
                document.getElementById('newClientName').value = '';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
