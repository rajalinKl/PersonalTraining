<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Progress Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">Client Progress Tracker</h1>
            <button onclick="openAddClientModal()" class="bg-indigo-500 hover:bg-indigo-400 text-xs px-3 py-1.5 rounded-lg font-medium transition">+ Add Client</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Client Selector & Quick Stats -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Select Client</label>
            <select id="clientSelect" onchange="switchClient()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
                <!-- Populated by JS -->
            </select>
        </section>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-200 p-1 rounded-xl">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm transition">Overview</button>
            <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">Log Session</button>
            <button onclick="switchTab('graphs')" id="tab-graphs" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">Progress Charts</button>
        </div>

        <!-- TAB 1: DASHBOARD (Last Session & Body Stats) -->
        <div id="content-dashboard" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3">Latest Body Stats</h2>
                <div id="latestStats" class="grid grid-cols-3 gap-2 text-center">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3">Last Workout Routine</h2>
                <div id="lastSessionContainer" class="space-y-3">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- TAB 2: LOG NEW SESSION -->
        <div id="content-log" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <h2 class="text-sm font-bold text-slate-700">Record New Workout & Stats</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Session Date</label>
                    <input type="date" id="logDate" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Body Weight (kg)</label>
                        <input type="number" id="logBodyWeight" placeholder="e.g. 70" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Exercise Name</label>
                        <input type="text" id="logExerciseName" placeholder="e.g. Leg Press" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Weight Lifted (kg)</label>
                        <input type="number" id="logWeightLifted" placeholder="e.g. 100" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Reps / Sets</label>
                        <input type="text" id="logReps" placeholder="e.g. 3x10" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                </div>
                <button onclick="saveNewSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg text-sm font-semibold shadow transition">Save Workout Entry</button>
            </div>
        </div>

        <!-- TAB 3: GRAPHS -->
        <div id="content-graphs" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-2">Weight Lifted Progress (Legs / Main)</h2>
                <canvas id="weightChart"></canvas>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-2">Body Weight Trend</h2>
                <canvas id="bodyWeightChart"></canvas>
            </div>
        </div>

    </main>

    <!-- Add Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm p-5 rounded-2xl space-y-4">
            <h3 class="font-bold text-base text-slate-800">Add New Client</h3>
            <input type="text" id="newClientName" placeholder="Client Full Name" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
            <div class="flex space-x-2">
                <button onclick="closeAddClientModal()" class="flex-1 bg-slate-100 py-2 rounded-lg text-xs font-semibold text-slate-600">Cancel</button>
                <button onclick="addNewClient()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-xs font-semibold">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Initial Database containing initial seed info for Rajal and Ramneek
        let db = {
            "Rajal": {
                bodyStats: [{ date: '2026-08-01', weight: 65 }, { date: '2026-08-15', weight: 64.5 }, { date: '2026-08-28', weight: 64 }],
                workouts: [
                    { date: '2026-08-15', exercises: [{ name: 'Leg Press', weight: 80, reps: '3x10' }, { name: 'Bulgarian Split Squat', weight: 20, reps: '3x12' }] },
                    { date: '2026-08-28', exercises: [{ name: 'Leg Press', weight: 90, reps: '3x10' }, { name: 'Bulgarian Split Squat', weight: 22.5, reps: '3x12' }] }
                ]
            },
            "Ramneek": {
                bodyStats: [{ date: '2026-08-05', weight: 78 }, { date: '2026-08-20', weight: 77.2 }],
                workouts: [
                    { date: '2026-08-20', exercises: [{ name: 'Barbell Squat', weight: 60, reps: '4x8' }, { name: 'Leg Extension', weight: 45, reps: '3x12' }] }
                ]
            }
        };

        let currentClient = "Rajal";
        let weightChartInstance = null;
        let bodyWeightChartInstance = null;

        function initApp() {
            updateClientDropdown();
            renderDashboard();
            renderCharts();
        }

        function updateClientDropdown() {
            const select = document.getElementById('clientSelect');
            select.innerHTML = '';
            Object.keys(db).forEach(client => {
                let opt = document.createElement('option');
                opt.value = client;
                opt.textContent = client;
                if(client === currentClient) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchClient() {
            currentClient = document.getElementById('clientSelect').value;
            renderDashboard();
            renderCharts();
        }

        function switchTab(tab) {
            ['dashboard', 'log', 'graphs'].forEach(t => {
                document.getElementById('content-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                document.getElementById('tab-' + t).classList.add('text-slate-600');
            });
            document.getElementById('content-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('bg-white', 'shadow-sm', 'text-slate-800');
            document.getElementById('tab-' + tab).classList.remove('text-slate-600');
            if(tab === 'graphs') renderCharts();
        }

        function renderDashboard() {
            const clientData = db[currentClient];
            
            // Latest Stats
            const statsContainer = document.getElementById('latestStats');
            const latestWeight = clientData.bodyStats.length > 0 ? clientData.bodyStats[clientData.bodyStats.length - 1].weight : 'N/A';
            statsContainer.innerHTML = `
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                    <span class="block text-[10px] text-slate-400 uppercase font-bold">Body Wt</span>
                    <span class="text-sm font-bold text-indigo-600">${latestWeight} kg</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                    <span class="block text-[10px] text-slate-400 uppercase font-bold">Total Workouts</span>
                    <span class="text-sm font-bold text-indigo-600">${clientData.workouts.length}</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                    <span class="block text-[10px] text-slate-400 uppercase font-bold">Status</span>
                    <span class="text-xs font-bold text-emerald-600">Active</span>
                </div>
            `;

            // Last Session
            const sessionContainer = document.getElementById('lastSessionContainer');
            if(clientData.workouts.length === 0) {
                sessionContainer.innerHTML = `<p class="text-xs text-slate-400">No workout sessions recorded yet.</p>`;
                return;
            }
            const lastWorkout = clientData.workouts[clientData.workouts.length - 1];
            let html = `<div class="text-xs text-indigo-500 font-semibold mb-2">Date: ${lastWorkout.date}</div>`;
            lastWorkout.exercises.forEach(ex => {
                html += `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg text-xs border border-slate-100 mb-1">
                        <span class="font-medium text-slate-700">${ex.name}</span>
                        <span class="font-bold text-slate-900">${ex.weight} kg (${ex.reps})</span>
                    </div>
                `;
            });
            sessionContainer.innerHTML = html;
        }

        function saveNewSession() {
            const date = document.getElementById('logDate').value || new Date().toISOString().split('T')[0];
            const bodyWeight = parseFloat(document.getElementById('logBodyWeight').value);
            const exName = document.getElementById('logExerciseName').value;
            const weightLifted = parseFloat(document.getElementById('logWeightLifted').value);
            const reps = document.getElementById('logReps').value;

            if(!exName || isNaN(weightLifted)) {
                alert("Please fill out exercise name and weight lifted.");
                return;
            }

            if(!db[currentClient]) db[currentClient] = { bodyStats: [], workouts: [] };

            if(!isNaN(bodyWeight)) {
                db[currentClient].bodyStats.push({ date, weight: bodyWeight });
            }

            // Check if a workout for this date already exists
            let existingWorkout = db[currentClient].workouts.find(w => w.date === date);
            if(existingWorkout) {
                existingWorkout.exercises.push({ name: exName, weight: weightLifted, reps: reps || '3x10' });
            } else {
                db[currentClient].workouts.push({
                    date,
                    exercises: [{ name: exName, weight: weightLifted, reps: reps || '3x10' }]
                });
            }

            alert("Session recorded successfully!");
            document.getElementById('logExerciseName').value = '';
            document.getElementById('logWeightLifted').value = '';
            document.getElementById('logReps').value = '';
            renderDashboard();
            switchTab('dashboard');
        }

        function renderCharts() {
            const clientData = db[currentClient];

            // Weight Lifted Chart (tracking first or primary leg exercise like Leg Press)
            let exerciseDates = [];
            let exerciseWeights = [];
            
            // Collect primary tracked movement data
            clientData.workouts.forEach(w => {
                w.exercises.forEach(ex => {
                    exerciseDates.push(w.date);
                    exerciseWeights.push(ex.weight);
                });
            });

            const ctxWeight = document.getElementById('weightChart').getContext('2d');
            if(weightChartInstance) weightChartInstance.destroy();
            weightChartInstance = new Chart(ctxWeight, {
                type: 'line',
                data: {
                    labels: exerciseDates,
                    datasets: [{
                        label: 'Weight Lifted (kg)',
                        data: exerciseWeights,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: false } } }
            });

            // Body Weight Chart
            const bodyDates = clientData.bodyStats.map(s => s.date);
            const bodyWeights = clientData.bodyStats.map(s => s.weight);

            const ctxBody = document.getElementById('bodyWeightChart').getContext('2d');
            if(bodyWeightChartInstance) bodyWeightChartInstance.destroy();
            bodyWeightChartInstance = new Chart(ctxBody, {
                type: 'line',
                data: {
                    labels: bodyDates,
                    datasets: [{
                        label: 'Body Weight (kg)',
                        data: bodyWeights,
                        borderColor: '#06b6d4',
                        backgroundColor: 'rgba(6, 182, 212, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: { responsive: true }
            });
        }

        function openAddClientModal() { document.getElementById('clientModal').classList.remove('hidden'); }
        function closeAddClientModal() { document.getElementById('clientModal').classList.add('hidden'); }
        function addNewClient() {
            const name = document.getElementById('newClientName').value.trim();
            if(name && !db[name]) {
                db[name] = { bodyStats: [], workouts: [] };
                currentClient = name;
                updateClientDropdown();
                renderDashboard();
                closeAddClientModal();
                document.getElementById('newClientName').value = '';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
