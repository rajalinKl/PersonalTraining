<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrainer Elite - Client Analytics & Logger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast-animate { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased pb-24 selection:bg-indigo-600 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Top Navigation Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.4)] animate-pulse"></div>
                <h1 class="text-sm font-extrabold tracking-tight text-slate-900 uppercase tracking-wider">ProTrainer <span class="text-indigo-600 font-medium">Elite</span></h1>
            </div>
            <div id="headerActions" class="flex items-center space-x-2">
                <button onclick="toggleRoleMode()" id="roleToggleBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] px-2.5 py-1.5 rounded-xl font-bold transition">Trainer Mode</button>
                <button onclick="openAddClientModal()" id="addClientBtn" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-xl font-bold text-white transition shadow-md shadow-indigo-600/20 active:scale-95">+ Add Client</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Client Selector & Overview Card -->
        <section class="bg-white p-4.5 rounded-2xl shadow-md border border-slate-200 space-y-3.5 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/5 rounded-full blur-2xl pointer-events-none"></div>
            <div>
                <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5">Active Client Profile</label>
                <select id="clientSelect" onchange="switchClient()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition shadow-inner">
                    <!-- Populated by JS -->
                </select>
            </div>
            <div id="clientSummaryStats" class="grid grid-cols-3 gap-2.5 pt-1 text-center">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Navigation Tab Menu -->
        <div class="flex bg-slate-200/80 p-1.5 rounded-2xl border border-slate-300/60 shadow-inner">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition-all">Sessions</button>
            <button onclick="switchTab('exercises')" id="tab-exercises" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition-all">Exercises</button>
            <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition-all">Progress</button>
            <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition-all trainer-only">+ Log</button>
        </div>

        <!-- TAB 1: SESSIONS -->
        <div id="content-dashboard" class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Sessions by Month</h2>
            </div>
            <div id="allSessionsContainer" class="space-y-3">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- TAB 2: EXERCISE DIRECTORY -->
        <div id="content-exercises" class="space-y-3 hidden">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                <input type="text" id="exerciseSearch" placeholder="Search exercises (e.g. Squats, Bench)..." oninput="filterExercises()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 placeholder-slate-400 outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <div id="exerciseDirectoryContainer" class="space-y-2.5">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- TAB 3: ADVANCED ANALYTICS & PROGRESS -->
        <div id="content-analytics" class="space-y-4 hidden">
            <div class="bg-white p-4.5 rounded-2xl shadow-md border border-slate-200 space-y-3.5">
                <div class="flex justify-between items-center">
                    <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">InBody Scan & Composition</h2>
                    <button onclick="openBodyMetricModal()" class="trainer-only text-[10px] bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-xl font-bold text-white transition shadow-md shadow-indigo-600/20">+ Log Scan</button>
                </div>
                <div class="relative h-52 bg-slate-50 p-3 rounded-xl border border-slate-200 shadow-inner">
                    <canvas id="bodyStatsChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-4.5 rounded-2xl shadow-md border border-slate-200 space-y-3">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Muscle Group Volume Distribution</h2>
                <div id="muscleGroupStatsContainer" class="space-y-2.5">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- TAB 4: ENHANCED MULTI-SET WORKOUT LOGGER -->
        <div id="content-log" class="space-y-4 hidden trainer-only">
            <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Record Full Workout Session</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">Session Date</label>
                        <input type="date" id="logDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">Phase / Tag</label>
                        <input type="text" id="logPhase" placeholder="e.g. P2, W1D1" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-indigo-600 outline-none">
                    </div>
                </div>

                <div class="space-y-3 pt-1">
                    <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Exercises Performed</label>
                    <div id="logExerciseBlocksContainer" class="space-y-4"></div>
                    <button type="button" onclick="addExerciseBlock()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl text-xs font-bold transition border border-slate-200 shadow-sm">+ Add Another Exercise</button>
                </div>

                <button onclick="saveStructuredSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/20 transition-all mt-2 active:scale-98">Save Complete Session</button>
            </div>
        </div>

    </main>

    <!-- EXERCISE DETAIL & PROGRESS CHART MODAL -->
    <div id="exerciseModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg p-5.5 rounded-3xl border border-slate-200 shadow-2xl space-y-4.5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3.5">
                <div>
                    <h3 id="modalExerciseTitle" class="font-extrabold text-base text-slate-900">Exercise Name</h3>
                    <span id="modalMuscleTag" class="text-[10px] uppercase font-extrabold tracking-wider px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-100 mt-1.5 inline-block">Muscle Group</span>
                </div>
                <button onclick="closeExerciseModal()" class="text-slate-400 hover:text-slate-700 bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition">✕</button>
            </div>

            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Graph Metric</label>
                    <select id="modalMetricSelect" onchange="updateExerciseModalChart()" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-600">
                        <option value="weight">Weight / Resistance</option>
                        <option value="reps">Repetitions</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Set Aggregation</label>
                    <select id="modalSetTypeSelect" onchange="updateExerciseModalChart()" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-600">
                        <option value="max">Max Set Value</option>
                        <option value="average">Average Set Value</option>
                        <option value="total">Total Volume (Sum)</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <h4 id="modalChartTitle" class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Progression Chart</h4>
                <div class="relative h-52 bg-slate-50 p-3 rounded-2xl border border-slate-200 shadow-inner">
                    <canvas id="exerciseModalChart"></canvas>
                </div>
            </div>
            <div class="space-y-2">
                <h4 class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Historical Performance Logs</h4>
                <div id="modalHistoryList" class="space-y-2 max-h-44 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <!-- UPDATE INBODY METRICS MODAL -->
    <div id="bodyMetricModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md p-6 rounded-3xl border border-slate-200 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="font-extrabold text-base text-slate-900">Log InBody Scan Metrics</h3>
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Scan Date</label>
                <input type="date" id="metricDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-800 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Weight (kg)</label>
                    <input type="number" step="0.1" id="metricWeight" placeholder="e.g. 65.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-800 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Skeletal Muscle (kg)</label>
                    <input type="number" step="0.1" id="metricMuscle" placeholder="e.g. 30.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-800 outline-none">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">Body Fat Mass (kg)</label>
                    <input type="number" step="0.1" id="metricFatMass" placeholder="e.g. 17.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-800 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">BMI (kg/m²)</label>
                    <input type="number" step="0.1" id="metricBmi" placeholder="e.g. 22.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-800 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Percent Body Fat (%)</label>
                <input type="number" step="0.1" id="metricBodyFatPct" placeholder="e.g. 26.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-800 outline-none">
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeBodyMetricModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 py-3 rounded-xl text-xs font-bold text-slate-700 transition">Cancel</button>
                <button onclick="saveBodyMetric()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 transition">Save InBody Scan</button>
            </div>
        </div>
    </div>

    <!-- Add Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm p-6 rounded-3xl border border-slate-200 shadow-2xl space-y-4">
            <h3 class="font-extrabold text-base text-slate-900">Add New Client</h3>
            <input type="text" id="newClientName" placeholder="Client Full Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-xs font-semibold text-slate-800 placeholder-slate-400 outline-none focus:ring-2 focus:ring-indigo-600">
            <div class="flex space-x-3 pt-2">
                <button onclick="closeAddClientModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 py-3 rounded-xl text-xs font-bold text-slate-700 transition">Cancel</button>
                <button onclick="addNewClient()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 transition">Save Client</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('protrainer_db')) || {
            "Rajal": {
                bodyMetrics: [
                    { date: '2025-12-01', weight: 65, muscle: 30, fatMass: 18, bmi: 23, bodyFatPct: 27 },
                    { date: '2026-06-01', weight: 64, muscle: 30.5, fatMass: 17, bmi: 22.5, bodyFatPct: 26.5 }
                ],
                sessions: [
                    { date: "2026-06-12", phase: "W1", exercises: [ { name: "Leg press", setsArray: [{type:"MC", weight:60, reps:12}, {type:"MC", weight:70, reps:12}] } ] }
                ]
            }
        };

        let currentClient = Object.keys(db)[0] || "Rajal";
        let isTrainerMode = true;
        let activeModalExercise = null;
        let modalChartInstance = null;
        let bodyStatsChartInstance = null;

        const weightTypes = ["BW", "CBL", "DB", "BB", "KB", "SB", "MC", "SM", "HS", "EZB", "MB"];

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs font-bold text-white flex items-center space-x-2 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function persistDb() {
            localStorage.setItem('protrainer_db', JSON.stringify(db));
        }

        function toggleRoleMode() {
            isTrainerMode = !isTrainerMode;
            const btn = document.getElementById('roleToggleBtn');
            btn.textContent = isTrainerMode ? "Trainer Mode" : "Client View Mode";
            btn.className = isTrainerMode ? "bg-indigo-50 text-indigo-700 text-[10px] px-2.5 py-1.5 rounded-xl font-bold transition border border-indigo-200" : "bg-emerald-50 text-emerald-700 text-[10px] px-2.5 py-1.5 rounded-xl font-bold transition border border-emerald-200";
            
            document.querySelectorAll('.trainer-only').forEach(el => {
                el.style.display = isTrainerMode ? '' : 'none';
            });
            showToast(`Switched to ${isTrainerMode ? 'Trainer' : 'Client'} perspective`, 'success');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            const day = String(d.getDate()).padStart(2, '0');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${day}-${months[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
        }

        function getMonthYearKey(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d)) return 'Unknown Period';
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return `${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function getMuscleGroup(exerciseName) {
            const name = exerciseName.toLowerCase();
            if (name.includes('squat') || name.includes('lunge') || name.includes('leg press') || name.includes('step')) return 'Quads & Glutes';
            if (name.includes('rdl') || name.includes('romanian') || name.includes('deadlift')) return 'Hamstrings & Posterior';
            if (name.includes('bench') || name.includes('press') && (name.includes('incline') || name.includes('chest')) || name.includes('push up')) return 'Chest & Push';
            if (name.includes('pull') || name.includes('row') || name.includes('lat')) return 'Back & Pull';
            if (name.includes('shoulder') || name.includes('raise') || name.includes('facepull')) return 'Shoulders';
            if (name.includes('curl') || name.includes('tricep') || name.includes('skull')) return 'Arms (Biceps/Triceps)';
            return 'Core & Full Body';
        }

        function formatSetsDisplay(setsArray) {
            if (!setsArray || setsArray.length === 0) return 'No sets recorded';
            return setsArray.map(s => {
                if (s.weight > 0) return `${s.type} ${s.weight} × ${s.reps}`;
                return `${s.type} × ${s.reps}`;
            }).join(', ');
        }

        function initApp() {
            updateClientDropdown();
            renderDashboard();
            renderExerciseDirectory();
            renderAnalytics();
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('metricDate').value = new Date().toISOString().split('T')[0];
            addExerciseBlock();
        }

        function updateClientDropdown() {
            const select = document.getElementById('clientSelect');
            select.innerHTML = '';
            Object.keys(db).forEach(client => {
                let opt = document.createElement('option');
                opt.value = client;
                opt.textContent = client;
                if(client === currentClient) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchClient() {
            currentClient = document.getElementById('clientSelect').value;
            renderDashboard();
            renderExerciseDirectory();
            renderAnalytics();
        }

        function switchTab(tab) {
            if(!isTrainerMode && tab === 'log') return;
            ['dashboard', 'exercises', 'analytics', 'log'].forEach(t => {
                const el = document.getElementById('content-' + t);
                const btn = document.getElementById('tab-' + t);
                if(el) el.classList.add('hidden');
                if(btn) {
                    btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
                    btn.classList.add('text-slate-600');
                }
            });
            document.getElementById('content-' + tab).classList.remove('hidden');
            const activeBtn = document.getElementById('tab-' + tab);
            activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
            activeBtn.classList.remove('text-slate-600');
            if(tab === 'analytics') renderAnalytics();
        }

        function toggleMonthAccordion(monthId) {
            const content = document.getElementById(`month-content-${monthId}`);
            const arrow = document.getElementById(`month-arrow-${monthId}`);
            content.classList.toggle('hidden');
            arrow.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function toggleSessionAccordion(sessionId) {
            const content = document.getElementById(`session-content-${sessionId}`);
            const arrow = document.getElementById(`session-arrow-${sessionId}`);
            content.classList.toggle('hidden');
            arrow.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function renderDashboard() {
            const clientData = db[currentClient] || { sessions: [] };
            const totalSessions = clientData.sessions.length;
            let uniqueExercises = new Set();
            clientData.sessions.forEach(s => s.exercises.forEach(e => uniqueExercises.add(e.name)));

            document.getElementById('clientSummaryStats').innerHTML = `
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 shadow-inner">
                    <span class="block text-[9px] text-slate-400 uppercase font-extrabold tracking-widest">Total Sessions</span>
                    <span class="text-sm font-extrabold text-indigo-600 mt-0.5 block">${totalSessions}</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 shadow-inner">
                    <span class="block text-[9px] text-slate-400 uppercase font-extrabold tracking-widest">Exercises</span>
                    <span class="text-sm font-extrabold text-emerald-600 mt-0.5 block">${uniqueExercises.size}</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 shadow-inner">
                    <span class="block text-[9px] text-slate-400 uppercase font-extrabold tracking-widest">Status</span>
                    <span class="text-xs font-bold text-sky-600 mt-1 block">Active</span>
                </div>
            `;

            const container = document.getElementById('allSessionsContainer');
            let sortedSessions = [...clientData.sessions].sort((a,b) => new Date(b.date) - new Date(a.date));
            
            let groupedByMonth = {};
            sortedSessions.forEach(session => {
                let myKey = getMonthYearKey(session.date);
                if (!groupedByMonth[myKey]) groupedByMonth[myKey] = [];
                groupedByMonth[myKey].push(session);
            });

            let html = '';
            let monthIndex = 0;
            let sessionGlobalIndex = 0;

            Object.keys(groupedByMonth).forEach(myKey => {
                let monthSessions = groupedByMonth[myKey];
                let mId = `month-${monthIndex++}`;

                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition mb-3">
                        <button onclick="toggleMonthAccordion('${mId}')" class="w-full p-4 flex justify-between items-center bg-slate-50/80 hover:bg-slate-100/80 transition text-left border-b border-slate-100">
                            <div class="flex items-center space-x-2.5">
                                <span class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">${myKey}</span>
                                <span class="text-[10px] font-bold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full border border-indigo-100">${monthSessions.length} sessions</span>
                            </div>
                            <svg id="month-arrow-${mId}" class="w-4 h-4 text-slate-400 transition-transform duration-200 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div id="month-content-${mId}" class="p-3 space-y-2 bg-white">
                `;

                monthSessions.forEach(session => {
                    let sId = `session-${sessionGlobalIndex++}`;
                    html += `
                        <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden transition">
                            <button onclick="toggleSessionAccordion('${sId}')" class="w-full p-3.5 flex justify-between items-center bg-white hover:bg-slate-50 transition text-left">
                                <div class="flex items-center space-x-3">
                                    <span class="text-xs font-extrabold text-indigo-600">${formatDate(session.date)}</span>
                                    ${session.phase ? `<span class="text-[10px] font-mono bg-indigo-50 text-indigo-700 border border-indigo-200/60 px-2 py-0.5 rounded-md font-bold">${session.phase}</span>` : ''}
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] text-slate-400 font-bold">${session.exercises.length} exercises</span>
                                    <svg id="session-arrow-${sId}" class="w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </button>
                            <div id="session-content-${sId}" class="hidden p-3.5 pt-0 space-y-2 border-t border-slate-100 bg-slate-50/50">
                    `;

                    session.exercises.forEach(ex => {
                        let muscle = getMuscleGroup(ex.name);
                        let displaySets = ex.setsArray ? formatSetsDisplay(ex.setsArray) : (ex.sets || '');
                        html += `
                            <div class="flex justify-between items-center bg-white p-2.5 rounded-xl text-xs border border-slate-200/60 shadow-xs mt-2">
                                <div>
                                    <span class="font-bold text-slate-800 block">${ex.name}</span>
                                    <span class="text-[9px] font-semibold text-slate-400 uppercase tracking-wide">${muscle}</span>
                                </div>
                                <span class="font-mono font-bold text-emerald-600 bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-lg text-right">${displaySets}</span>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html || '<p class="text-xs text-slate-400 text-center py-6">No session records found.</p>';
        }

        function addExerciseBlock() {
            const container = document.getElementById('logExerciseBlocksContainer');
            const blockId = 'ex-block-' + Date.now() + Math.random().toString(36).substring(2, 7);
            
            const blockDiv = document.createElement('div');
            blockDiv.id = blockId;
            blockDiv.className = "bg-slate-50 p-3.5 rounded-2xl border border-slate-200 shadow-xs space-y-3";
            blockDiv.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Exercise Item</span>
                    <button type="button" onclick="document.getElementById('${blockId}').remove()" class="text-rose-500 hover:text-rose-600 bg-rose-50 border border-rose-200 w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs transition">✕</button>
                </div>
                <div>
                    <input type="text" placeholder="Exercise Name (e.g. Bench press)" class="log-ex-name w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-800 placeholder-slate-400 outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-500 uppercase">Sets & Weights</span>
                        <button type="button" onclick="addSetRow('${blockId}-sets')" class="text-[10px] bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-bold px-2.5 py-1 rounded-lg border border-indigo-200/60 transition">+ Add Set</button>
                    </div>
                    <div id="${blockId}-sets" class="space-y-2"></div>
                </div>
            `;
            container.appendChild(blockDiv);
            addSetRow(`${blockId}-sets`);
        }

        function addSetRow(containerId) {
            const container = document.getElementById(containerId);
            const rowId = 'set-row-' + Date.now() + Math.random().toString(36).substring(2, 7);
            let weightTypeOptions = weightTypes.map(wt => `<option value="${wt}">${wt}</option>`).join('');

            const rowDiv = document.createElement('div');
            rowDiv.id = rowId;
            rowDiv.className = "flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200 shadow-xs";
            rowDiv.innerHTML = `
                <select class="set-wtype bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-600">${weightTypeOptions}</select>
                <input type="number" step="0.5" placeholder="Weight" class="set-weight w-20 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-600">
                <span class="text-xs font-bold text-slate-400">×</span>
                <input type="number" placeholder="Reps" class="set-reps w-16 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-600">
                <button type="button" onclick="document.getElementById('${rowId}').remove()" class="text-slate-400 hover:text-rose-500 font-bold text-xs p-1 ml-auto">✕</button>
            `;
            container.appendChild(rowDiv);
        }

        function saveStructuredSession() {
            const date = document.getElementById('logDate').value || new Date().toISOString().split('T')[0];
            const phase = document.getElementById('logPhase').value.trim();
            const blockDivs = document.querySelectorAll('#logExerciseBlocksContainer > div');
            let newExercises = [];

            blockDivs.forEach(block => {
                let nameInput = block.querySelector('.log-ex-name');
                let name = nameInput ? nameInput.value.trim() : '';
                let setRows = block.querySelectorAll('[id$="-sets"] > div');
                let setsArray = [];

                setRows.forEach(row => {
                    let type = row.querySelector('.set-wtype').value;
                    let weight = parseFloat(row.querySelector('.set-weight').value) || 0;
                    let reps = parseInt(row.querySelector('.set-reps').value) || 0;
                    if (reps > 0) setsArray.push({ type, weight, reps });
                });

                if (name && setsArray.length > 0) {
                    newExercises.push({ name, setsArray });
                }
            });

            if (newExercises.length === 0) {
                showToast("Please add at least one exercise with valid sets and repetitions.", "error");
                return;
            }

            let clientData = db[currentClient];
            let session = clientData.sessions.find(s => s.date === date);
            if (!session) {
                session = { date, phase, exercises: [] };
                clientData.sessions.push(session);
            }

            session.exercises.push(...newExercises);
            if(phase) session.phase = phase;

            persistDb();
            showToast("Workout session logged successfully!", "success");
            
            document.getElementById('logPhase').value = '';
            document.getElementById('logExerciseBlocksContainer').innerHTML = '';
            addExerciseBlock();
            
            renderDashboard();
            renderExerciseDirectory();
            renderAnalytics();
            switchTab('dashboard');
        }

        function renderExerciseDirectory(filter = '') {
            const clientData = db[currentClient] || { sessions: [] };
            const container = document.getElementById('exerciseDirectoryContainer');

            let exerciseMap = {};
            clientData.sessions.forEach(session => {
                session.exercises.forEach(ex => {
                    let cleanName = ex.name.trim();
                    if (!exerciseMap[cleanName]) {
                        exerciseMap[cleanName] = { name: cleanName, muscle: getMuscleGroup(cleanName), count: 0, lastSets: '' };
                    }
                    exerciseMap[cleanName].count++;
                    exerciseMap[cleanName].lastSets = ex.setsArray ? formatSetsDisplay(ex.setsArray) : (ex.sets || '');
                });
            });

            let exercises = Object.values(exerciseMap).sort((a,b) => b.count - a.count);
            if (filter) exercises = exercises.filter(e => e.name.toLowerCase().includes(filter.toLowerCase()));

            let html = '';
            exercises.forEach(ex => {
                html += `
                    <div onclick="openExerciseModal('${ex.name.replace(/'/g, "\\'")}')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300 hover:shadow-md transition-all group">
                        <div>
                            <div class="text-xs font-bold text-slate-800 group-hover:text-indigo-600 transition">${ex.name}</div>
                            <div class="text-[10px] text-slate-400 font-semibold mt-0.5">${ex.muscle} • <span class="text-slate-500">${ex.count} sessions</span></div>
                        </div>
                        <div class="text-right">
                            <span class="text-[11px] font-mono font-bold text-emerald-600 bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-xl">${ex.lastSets}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || '<p class="text-xs text-slate-400 text-center py-6">No exercises found.</p>';
        }

        function filterExercises() {
            renderExerciseDirectory(document.getElementById('exerciseSearch').value);
        }

        function renderAnalytics() {
            const clientData = db[currentClient] || { sessions: [], bodyMetrics: [] };
            let muscleCounts = {};
            clientData.sessions.forEach(s => {
                s.exercises.forEach(e => {
                    let m = getMuscleGroup(e.name);
                    muscleCounts[m] = (muscleCounts[m] || 0) + 1;
                });
            });

            let muscleContainer = document.getElementById('muscleGroupStatsContainer');
            let muscleHtml = '';
            let totalExCount = Object.values(muscleCounts).reduce((a,b) => a+b, 0) || 1;

            Object.keys(muscleCounts).forEach(muscle => {
                let count = muscleCounts[muscle];
                let percent = Math.round((count / totalExCount) * 100);
                muscleHtml += `
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 shadow-inner space-y-1.5">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-slate-800">${muscle}</span>
                            <span class="font-mono text-indigo-600 font-bold">${count} entries (${percent}%)</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden p-0.5 border border-slate-300/50">
                            <div class="bg-gradient-to-r from-indigo-600 to-emerald-500 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
            muscleContainer.innerHTML = muscleHtml || '<p class="text-xs text-slate-400">No workout data available.</p>';

            let metrics = clientData.bodyMetrics || [];
            metrics.sort((a,b) => new Date(a.date) - new Date(b.date));

            const ctx = document.getElementById('bodyStatsChart').getContext('2d');
            if (bodyStatsChartInstance) bodyStatsChartInstance.destroy();
            bodyStatsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: metrics.length ? metrics.map(m => formatDate(m.date)) : ['No Data'],
                    datasets: [
                        { label: 'Weight (kg)', data: metrics.length ? metrics.map(m => m.weight) : [0], borderColor: '#0284c7', backgroundColor: 'rgba(2, 132, 199, 0.05)', borderWidth: 2.5, fill: true, tension: 0.25 },
                        { label: 'Muscle Mass (kg)', data: metrics.length ? metrics.map(m => m.muscle || 0) : [0], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.05)', borderWidth: 2.5, fill: true, tension: 0.25 },
                        { label: 'Body Fat (kg)', data: metrics.length ? metrics.map(m => m.fatMass || 0) : [0], borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.05)', borderWidth: 2.5, fill: true, tension: 0.25 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#475569', font: { size: 9, family: 'Plus Jakarta Sans', weight: '700' } } } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#e2e8f0' } },
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#e2e8f0' } }
                    }
                }
            });
        }

        function openExerciseModal(exerciseName) {
            activeModalExercise = exerciseName;
            const clientData = db[currentClient];
            document.getElementById('modalExerciseTitle').textContent = exerciseName;
            document.getElementById('modalMuscleTag').textContent = getMuscleGroup(exerciseName);
            document.getElementById('exerciseModal').classList.remove('hidden');

            let historyHtml = '';
            let sortedSessions = [...clientData.sessions].sort((a,b) => new Date(b.date) - new Date(a.date));

            sortedSessions.forEach(session => {
                session.exercises.forEach(ex => {
                    if (ex.name.toLowerCase() === exerciseName.toLowerCase()) {
                        let displaySets = ex.setsArray ? formatSetsDisplay(ex.setsArray) : (ex.sets || '');
                        historyHtml += `
                            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl text-xs border border-slate-200">
                                <span class="text-indigo-600 font-bold">${formatDate(session.date)}</span>
                                <span class="font-mono text-emerald-600 font-bold">${displaySets}</span>
                            </div>
                        `;
                    }
                });
            });

            document.getElementById('modalHistoryList').innerHTML = historyHtml || '<p class="text-xs text-slate-400">No logs for this exercise.</p>';
            updateExerciseModalChart();
        }

        function updateExerciseModalChart() {
            if (!activeModalExercise) return;
            const clientData = db[currentClient];
            const metric = document.getElementById('modalMetricSelect').value;
            const setType = document.getElementById('modalSetTypeSelect').value;

            let dates = [], values = [];
            let sortedSessions = [...clientData.sessions].sort((a,b) => new Date(a.date) - new Date(b.date));

            sortedSessions.forEach(session => {
                session.exercises.forEach(ex => {
                    if (ex.name.toLowerCase() === activeModalExercise.toLowerCase() && ex.setsArray) {
                        let metricValues = ex.setsArray.map(s => metric === 'weight' ? s.weight : s.reps);
                        if (metricValues.length > 0) {
                            let computedVal = 0;
                            if (setType === 'max') computedVal = Math.max(...metricValues);
                            else if (setType === 'average') computedVal = Number((metricValues.reduce((a,b)=>a+b,0)/metricValues.length).toFixed(1));
                            else if (setType === 'total') computedVal = metricValues.reduce((a,b)=>a+b,0);

                            dates.push(formatDate(session.date));
                            values.push(computedVal);
                        }
                    }
                });
            });

            const ctx = document.getElementById('exerciseModalChart').getContext('2d');
            if (modalChartInstance) modalChartInstance.destroy();
            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates.length ? dates : ['No Data Available'],
                    datasets: [{
                        label: `${setType} ${metric}`,
                        data: values.length ? values : [0],
                        borderColor: metric === 'weight' ? '#4f46e5' : '#10b981',
                        backgroundColor: metric === 'weight' ? 'rgba(79, 70, 229, 0.08)' : 'rgba(16, 185, 129, 0.08)',
                        borderWidth: 2.5, fill: true, tension: 0.25
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#e2e8f0' } },
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#e2e8f0' } }
                    }
                }
            });
        }

        function closeExerciseModal() { 
            document.getElementById('exerciseModal').classList.add('hidden'); 
            activeModalExercise = null;
        }
        
        function openBodyMetricModal() { document.getElementById('bodyMetricModal').classList.remove('hidden'); }
        function closeBodyMetricModal() { document.getElementById('bodyMetricModal').classList.add('hidden'); }
        
        function saveBodyMetric() {
            const date = document.getElementById('metricDate').value;
            const weight = parseFloat(document.getElementById('metricWeight').value);
            if(!date || isNaN(weight)) {
                showToast("Please provide a valid date and body weight.", "error");
                return;
            }

            let clientData = db[currentClient];
            if(!clientData.bodyMetrics) clientData.bodyMetrics = [];

            clientData.bodyMetrics = clientData.bodyMetrics.filter(m => m.date !== date);
            clientData.bodyMetrics.push({ 
                date, weight, 
                muscle: parseFloat(document.getElementById('metricMuscle').value) || null, 
                fatMass: parseFloat(document.getElementById('metricFatMass').value) || null, 
                bmi: parseFloat(document.getElementById('metricBmi').value) || null, 
                bodyFatPct: parseFloat(document.getElementById('metricBodyFatPct').value) || null 
            });

            persistDb();
            showToast("InBody scan metrics saved successfully!", "success");
            closeBodyMetricModal();
            renderAnalytics();
        }

        function openAddClientModal() { document.getElementById('clientModal').classList.remove('hidden'); }
        function closeAddClientModal() { document.getElementById('clientModal').classList.add('hidden'); }
        
        function addNewClient() {
            const name = document.getElementById('newClientName').value.trim();
            if(name && !db[name]) {
                db[name] = { bodyMetrics: [], sessions: [] };
                currentClient = name;
                persistDb();
                updateClientDropdown();
                renderDashboard();
                renderExerciseDirectory();
                renderAnalytics();
                closeAddClientModal();
                document.getElementById('newClientName').value = '';
                showToast(`Client ${name} created successfully!`, "success");
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
